# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
    App\cobros\domain\CuentaPorCobrarRepositoryInterface: '@App\cobros\infrastructure\CuentaPorCobrarRepository'
    App\facturacion\domain\FacturaRepositoryInterface: '@App\facturacion\infrastructure\FacturaRepository'
    App\control_acceso\domain\AccesoMiembroRepositoryInterface: '@App\control_acceso\infrastructure\AccesoMiembroRepository'
    App\control_acceso\domain\SituacionFinancieraPortInterface: '@App\control_acceso\infrastructure\SituacionFinancieraAdapter'
    App\control_acceso\domain\AvisoPrevioRepositoryInterface: '@App\control_acceso\infrastructure\AvisoPrevioRepository'
    App\cobros\application\VerificarPagoPortInterface: '@App\cobros\infrastructure\SimulatedPaymentVerificationAdapter'
    App\cobros\application\DevolucionPortInterface: '@App\cobros\infrastructure\SimulatedRefundAdapter'
    App\cobros\infrastructure\SimulatedRefundAdapter:
        arguments:
            $environment: '%kernel.environment%'
    App\cobros\infrastructure\SimulatedPaymentVerificationAdapter:
        arguments:
            $environment: '%kernel.environment%'
    App\facturacion\application\EmisionFiscalPortInterface: '@App\facturacion\infrastructure\SimulatedFiscalIssuanceAdapter'
    App\facturacion\infrastructure\SimulatedFiscalIssuanceAdapter:
        arguments:
            $environment: '%kernel.environment%'
    App\facturacion\application\EnvioFacturaPortInterface: '@App\facturacion\infrastructure\SimulatedInvoiceDeliveryAdapter'
    App\facturacion\infrastructure\SimulatedInvoiceDeliveryAdapter:
        arguments:
            $environment: '%kernel.environment%'
    App\control_acceso\application\RegistroHuellaPortInterface: '@App\control_acceso\infrastructure\SimulatedFingerprintAdapter'
    App\control_acceso\infrastructure\SimulatedFingerprintAdapter:
        arguments:
            $environment: '%kernel.environment%'
    App\control_acceso\application\NotificacionSuspensionPortInterface: '@App\control_acceso\infrastructure\SimulatedSuspensionNoticeAdapter'
    App\control_acceso\infrastructure\SimulatedSuspensionNoticeAdapter:
        arguments:
            $environment: '%kernel.environment%'
    App\control_acceso\application\DerechoAccesoPortInterface: '@App\control_acceso\infrastructure\SimulatedEntitlementAdapter'
    App\control_acceso\infrastructure\SimulatedEntitlementAdapter:
        arguments:
            $environment: '%kernel.environment%'
