services:

  # PHP
  node-fac-cob:
    container_name: node-fac-cob
    build:
      target: dev
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        userid: $userid
    environment:
      XDEBUG_CLIENT_HOST: 172.17.0.1
      XDEBUG_CLIENT_PORT: 9003
      PHP_IDE_CONFIG: serverName=Docker
    networks:
      - faccob_network
    volumes:
      - ./:/appdata/www
      - ./docker/php/xdebug.ini:/usr/local/etc/php/conf.d/xdebug.ini

  # NGINX
  faccob-web:
    container_name: faccob-web
    build:
      target: dev
      context: .
      dockerfile: docker/nginx/Dockerfile
    ports:
      - '8008:80'
    volumes:
      - ./:/appdata/www
    links:
      - node-fac-cob
    networks:
      - faccob_network
    depends_on:
      - node-fac-cob

  mailer:
    container_name: faccob-mailer
    image: schickling/mailcatcher
    ports:
      - '1081:1080'
      - '1026:1025'
    networks:
      - faccob_network

  db:
    container_name: faccob-postgres
    build:
      context: .
      dockerfile: docker/postgresql/Dockerfile
    ports:
      - '5439:5432'
    environment:
      POSTGRES_USER: faccob
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: faccob
      TZ: 'America/La_Paz'
      PGTZ: 'America/La_Paz'
    volumes:
      - faccob-pgsql-data:/var/lib/postgresql/data
    networks:
      - faccob_network

networks:
  faccob_network:

volumes:
  faccob-pgsql-data:

